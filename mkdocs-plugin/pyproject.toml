[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkdocs-agentready"
version = "1.0.0"
description = "MkDocs plugin that submits your docs site to AgentReady after every build, making it instantly queryable by AI agents via MCP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["mkdocs>=1.4"]
keywords = ["mkdocs", "plugin", "ai", "mcp", "llms", "agents", "documentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://www.agentready.it.com"
Repository = "https://github.com/AshutoshRaj97/agentready-mcp/tree/main/mkdocs-plugin"
"Bug Tracker" = "https://github.com/AshutoshRaj97/agentready-mcp/issues"

[project.entry-points."mkdocs.plugins"]
agentready = "mkdocs_agentready.plugin:AgentReadyPlugin"
