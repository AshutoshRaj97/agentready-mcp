[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sphinx-agentready"
version = "1.0.0"
description = "Sphinx extension that submits your docs to AgentReady after every build, making them instantly queryable by AI agents via MCP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = ["sphinx>=5.0"]
keywords = ["sphinx", "extension", "ai", "mcp", "llms", "agents", "documentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Sphinx :: Extension",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]

[project.urls]
Homepage = "https://www.agentready.it.com"
Repository = "https://github.com/AshutoshRaj97/agentready-mcp/tree/main/sphinx-plugin"
"Bug Tracker" = "https://github.com/AshutoshRaj97/agentready-mcp/issues"

[project.entry-points."sphinx.extension"]
sphinx_agentready = "sphinx_agentready.extension"
